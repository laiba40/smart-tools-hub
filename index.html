<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Tools Hub</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
text-align:center;
}

header{
background:#2563eb;
color:white;
padding:40px;
}

h1{
margin:0;
font-size:40px;
}

p{
font-size:18px;
}

.container{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
}

footer{
background:#111827;
color:white;
padding:20px;
margin-top:50px;
}
</style>

</head>

<body>

<header>
<h1>Smart Tools Hub</h1>
<p>Free Online AI & Utility Tools</p>
</header>

<div class="container">

<h2>Popular Tools</h2>

<div class="grid">

<div class="card">
<h3>eBay Profit Calculator</h3>
<p>Calculate your eBay profits instantly.</p>
<button>Coming Soon</button>
</div>

<div class="card">
<h3>Password Generator</h3>
<p>Create secure passwords in one click.</p>
<button>Coming Soon</button>
</div>

<div class="card">
<h3>QR Code Generator</h3>
<p>Generate QR codes free.</p>
<button>Coming Soon</button>
</div>

</div>

</div>

<footer>

© 2026 Smart Tools Hub

</footer>

</body>
</html>
